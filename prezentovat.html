  <!-- Oddělená aplikace čistě pro výběr, promítání a export (PDF + PPTX) -->
  <script>
    (function () {
      const { useState, useEffect, useRef } = React;
      const { createRoot } = ReactDOM;
      const {
        Cpu, Play, ChevronLeft, ChevronRight, Maximize2,
        List, Pointer, X, Search, BookOpen, Cloud, Download, FileText
      } = window.ICON_MAP;

      // Pomocná funkce: převede SVG data URI na PNG base64, aby fungovalo ve všech verzích PowerPointu
      function svgDataUrlToPng(svgUrl) {
        return new Promise((resolve) => {
          try {
            const img = new Image();
            img.onload = () => {
              try {
                const canvas = document.createElement('canvas');
                canvas.width = 1200;
                canvas.height = 750;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const ratio = Math.min(canvas.width / (img.width || 800), canvas.height / (img.height || 500));
                const w = (img.width || 800) * ratio;
                const h = (img.height || 500) * ratio;
                ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
                resolve(canvas.toDataURL('image/png'));
              } catch (e) {
                resolve(null);
              }
            };
            img.onerror = () => resolve(null);
            img.src = svgUrl;
          } catch (e) {
            resolve(null);
          }
        });
      }

      // Generování plnohodnotné editovatelné prezentace PowerPoint (.pptx) v tmavém stylu 16:9
      async function exportDeckToPptx(deck) {
        if (!window.PptxGenJS) {
          alert('Knihovna pro export PPTX se nepodařila načíst. Zkontrolujte připojení k internetu.');
          return;
        }

        const pptx = new window.PptxGenJS();
        pptx.layout = 'LAYOUT_WIDE'; // 13.333 × 7.5 palce (16:9)
        pptx.title = deck.title || 'Prezentace';
        pptx.subject = deck.subtitle || '';
        pptx.author = 'ICT Výukový Portál';

        const C = {
          bg: '0B1120',
          card: '0F172A',
          cardAlt: '111C33',
          border: '1E293B',
          cyan: '00D2FF',
          cyanDark: '0C2B3F',
          white: 'FFFFFF',
          text: 'E2E8F0',
          muted: '94A3B8',
          dim: '64748B'
        };
        const FONT = 'Calibri';

        const addHeader = (pptSlide, badge, title) => {
          if (badge) {
            pptSlide.addText(String(badge).toUpperCase(), {
              x: 0.65, y: 0.4, w: 12.0, h: 0.35,
              fontFace: FONT, fontSize: 12, bold: true, color: C.cyan, charSpacing: 1.5
            });
          }
          pptSlide.addText(String(title || '').replace(/\n/g, ' '), {
            x: 0.65, y: 0.72, w: 12.0, h: 0.85,
            fontFace: FONT, fontSize: 28, bold: true, color: C.white, valign: 'top'
          });
        };

        const addFooter = (pptSlide, idx, total) => {
          pptSlide.addText(`${idx + 1} / ${total}`, {
            x: 11.8, y: 7.05, w: 1.0, h: 0.3,
            fontFace: FONT, fontSize: 10, color: C.dim, align: 'right'
          });
        };

        const slides = deck.slides || [];

        for (let idx = 0; idx < slides.length; idx++) {
          const s = slides[idx];
          const pptSlide = pptx.addSlide();
          pptSlide.background = { color: C.bg };

          // 1. TITULNÍ SLAJD
          if (s.type === 'title') {
            pptSlide.addShape(pptx.ShapeType.roundRect, {
              x: 0.75, y: 1.55, w: 3.1, h: 0.45,
              fill: { color: C.cyanDark }, line: { color: C.cyan, pt: 1 }, rectRadius: 0.22
            });
            pptSlide.addText(String(s.badge || 'ICT').toUpperCase(), {
              x: 0.85, y: 1.58, w: 2.9, h: 0.4,
              fontFace: FONT, fontSize: 12, bold: true, color: C.cyan, align: 'center', valign: 'middle'
            });

            pptSlide.addText(String(s.title || ''), {
              x: 0.75, y: 2.25, w: 11.8, h: 2.0,
              fontFace: FONT, fontSize: 42, bold: true, color: C.white, valign: 'top'
            });

            if (s.subtitle) {
              pptSlide.addShape(pptx.ShapeType.rect, {
                x: 0.75, y: 4.5, w: 0.08, h: 1.05,
                fill: { color: C.cyan }, line: { color: C.cyan }
              });
              pptSlide.addText(String(s.subtitle), {
                x: 1.02, y: 4.5, w: 10.8, h: 1.05,
                fontFace: FONT, fontSize: 20, color: C.text, valign: 'middle'
              });
            }
          }

          // 2. SEKČNÍ PŘEDĚL
          else if (s.type === 'section') {
            pptSlide.addText(String(s.badge || 'SEKCE').toUpperCase(), {
              x: 1.0, y: 2.05, w: 11.33, h: 0.45,
              fontFace: FONT, fontSize: 14, bold: true, color: C.cyan, align: 'center', charSpacing: 2
            });
            pptSlide.addText(String(s.title || ''), {
              x: 1.0, y: 2.6, w: 11.33, h: 1.3,
              fontFace: FONT, fontSize: 44, bold: true, color: C.white, align: 'center', valign: 'middle'
            });
            if (s.subtitle) {
              pptSlide.addText(String(s.subtitle), {
                x: 1.8, y: 4.1, w: 9.73, h: 1.2,
                fontFace: FONT, fontSize: 20, color: C.text, align: 'center', valign: 'top'
              });
            }
          }

          // 3. TŘI KARTY + ANALOGIE
          else if (s.type === 'cards-3') {
            addHeader(pptSlide, s.badge, s.title);

            let cardsTop = 1.85;
            let cardH = 4.95;

            if (s.analogy) {
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: 0.65, y: 1.65, w: 12.03, h: 0.95,
                fill: { color: C.card }, line: { color: C.cyan, pt: 1 }, rectRadius: 0.12
              });
              pptSlide.addText(String(s.analogy), {
                x: 0.9, y: 1.72, w: 11.53, h: 0.82,
                fontFace: FONT, fontSize: 15, color: C.text, valign: 'middle'
              });
              cardsTop = 2.85;
              cardH = 3.95;
            }

            const cards = s.cards || [];
            const count = Math.max(cards.length, 1);
            const gap = 0.28;
            const totalW = 12.03;
            const cardW = (totalW - gap * (count - 1)) / count;

            cards.forEach((card, i) => {
              const cx = 0.65 + i * (cardW + gap);
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: cx, y: cardsTop, w: cardW, h: cardH,
                fill: { color: C.card }, line: { color: C.border, pt: 1.2 }, rectRadius: 0.14
              });

              if (card.highlight) {
                pptSlide.addShape(pptx.ShapeType.roundRect, {
                  x: cx + 0.25, y: cardsTop + 0.25, w: cardW - 0.5, h: 0.42,
                  fill: { color: C.cyanDark }, line: { color: C.cyan, pt: 0.75 }, rectRadius: 0.08
                });
                pptSlide.addText(String(card.highlight), {
                  x: cx + 0.3, y: cardsTop + 0.27, w: cardW - 0.6, h: 0.38,
                  fontFace: FONT, fontSize: 13, bold: true, color: C.cyan, align: 'center', valign: 'middle'
                });
              }

              const titleY = card.highlight ? cardsTop + 0.85 : cardsTop + 0.35;
              pptSlide.addText(String(card.title || ''), {
                x: cx + 0.25, y: titleY, w: cardW - 0.5, h: 0.75,
                fontFace: FONT, fontSize: 18, bold: true, color: C.white, valign: 'top'
              });
              pptSlide.addText(String(card.text || ''), {
                x: cx + 0.25, y: titleY + 0.8, w: cardW - 0.5, h: cardH - (titleY - cardsTop) - 1.0,
                fontFace: FONT, fontSize: 14, color: C.text, valign: 'top'
              });
            });
          }

          // 4. POROVNÁNÍ DVOU SLOUPCŮ
          else if (s.type === 'comparison') {
            addHeader(pptSlide, s.badge, s.title);

            let topY = 1.8;
            let colH = 5.0;
            if (s.analogy) {
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: 0.65, y: 1.65, w: 12.03, h: 0.75,
                fill: { color: C.card }, line: { color: C.border, pt: 1 }, rectRadius: 0.1
              });
              pptSlide.addText(String(s.analogy), {
                x: 0.88, y: 1.7, w: 11.55, h: 0.65,
                fontFace: FONT, fontSize: 14, color: C.text, valign: 'middle'
              });
              topY = 2.6;
              colH = 4.25;
            }

            [s.left, s.right].forEach((col, i) => {
              if (!col) return;
              const cx = i === 0 ? 0.65 : 6.82;
              const cw = 5.86;
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: cx, y: topY, w: cw, h: colH,
                fill: { color: i === 0 ? C.card : C.cardAlt },
                line: { color: i === 0 ? C.border : C.cyan, pt: 1.2 },
                rectRadius: 0.14
              });
              pptSlide.addText(String(col.title || ''), {
                x: cx + 0.3, y: topY + 0.25, w: cw - 0.6, h: 0.5,
                fontFace: FONT, fontSize: 20, bold: true, color: C.white
              });
              if (col.subtitle) {
                pptSlide.addText(String(col.subtitle), {
                  x: cx + 0.3, y: topY + 0.72, w: cw - 0.6, h: 0.35,
                  fontFace: FONT, fontSize: 13, bold: true, color: C.cyan
                });
              }
              const bulletRuns = (col.points || []).map((pt) => ({
                text: String(pt),
                options: { bullet: { code: '2022', color: C.cyan }, breakLine: true, paraSpaceAfter: 8 }
              }));
              if (bulletRuns.length > 0) {
                pptSlide.addText(bulletRuns, {
                  x: cx + 0.3, y: topY + 1.2, w: cw - 0.6, h: colH - 1.45,
                  fontFace: FONT, fontSize: 14, color: C.text, valign: 'top'
                });
              }
            });
          }

          // 5. TEXT VLEVO + OBRÁZEK VPRAVO
          else if (s.type === 'split-image') {
            addHeader(pptSlide, s.badge, s.title);

            const pts = s.points || [];
            const boxH = Math.min(2.1, (4.85 - Math.max(0, pts.length - 1) * 0.2) / Math.max(pts.length, 1));
            pts.forEach((pt, i) => {
              const py = 1.85 + i * (boxH + 0.2);
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: 0.65, y: py, w: 5.8, h: boxH,
                fill: { color: C.card }, line: { color: C.border, pt: 1 }, rectRadius: 0.12
              });
              pptSlide.addText(String(pt.title || ''), {
                x: 0.9, y: py + 0.18, w: 5.3, h: 0.4,
                fontFace: FONT, fontSize: 16, bold: true, color: C.white
              });
              pptSlide.addText(String(pt.text || ''), {
                x: 0.9, y: py + 0.6, w: 5.3, h: boxH - 0.75,
                fontFace: FONT, fontSize: 13, color: C.text, valign: 'top'
              });
            });

            pptSlide.addShape(pptx.ShapeType.roundRect, {
              x: 6.75, y: 1.85, w: 5.93, h: 4.35,
              fill: { color: '020617' }, line: { color: C.border, pt: 1.2 }, rectRadius: 0.14
            });

            if (s.imageUrl) {
              let imgData = null;
              if (s.imageUrl.startsWith('data:image/svg+xml')) {
                imgData = await svgDataUrlToPng(s.imageUrl);
              } else if (s.imageUrl.startsWith('data:image/')) {
                imgData = s.imageUrl;
              }
              if (imgData) {
                pptSlide.addImage({
                  data: imgData,
                  x: 6.9, y: 2.0, w: 5.63, h: 4.05,
                  sizing: { type: 'contain', w: 5.63, h: 4.05 }
                });
              } else if (/^https?:\/\//i.test(s.imageUrl)) {
                try {
                  pptSlide.addImage({
                    path: s.imageUrl,
                    x: 6.9, y: 2.0, w: 5.63, h: 4.05,
                    sizing: { type: 'contain', w: 5.63, h: 4.05 }
                  });
                } catch (e) {}
              }
            }

            if (s.imageCaption) {
              pptSlide.addText(String(s.imageCaption), {
                x: 6.75, y: 6.3, w: 5.93, h: 0.4,
                fontFace: FONT, fontSize: 12, italic: true, color: C.muted, align: 'center'
              });
            }
          }

          // 6. VELKÉ ČÍSLO / STATISTIKA
          else if (s.type === 'big-stat') {
            addHeader(pptSlide, s.badge, s.title);

            pptSlide.addShape(pptx.ShapeType.roundRect, {
              x: 1.15, y: 1.95, w: 11.03, h: 4.7,
              fill: { color: C.card }, line: { color: C.cyan, pt: 1.2 }, rectRadius: 0.2
            });
            pptSlide.addText(String(s.stat || ''), {
              x: 1.4, y: 2.3, w: 10.53, h: 1.5,
              fontFace: FONT, fontSize: 64, bold: true, color: C.cyan, align: 'center', valign: 'middle'
            });
            pptSlide.addText(String(s.statLabel || ''), {
              x: 1.6, y: 3.9, w: 10.13, h: 0.7,
              fontFace: FONT, fontSize: 24, bold: true, color: C.white, align: 'center', valign: 'middle'
            });
            if (s.description) {
              pptSlide.addText(String(s.description), {
                x: 1.8, y: 4.75, w: 9.73, h: 1.5,
                fontFace: FONT, fontSize: 16, color: C.text, align: 'center', valign: 'top'
              });
            }
          }

          // 7. 4 KROKY PROCESU
          else if (s.type === 'steps-4') {
            addHeader(pptSlide, s.badge, s.title);

            const steps = s.steps || [];
            const count = Math.max(steps.length, 1);
            const gap = 0.22;
            const totalW = 12.03;
            const stepW = (totalW - gap * (count - 1)) / count;

            steps.forEach((st, i) => {
              const sx = 0.65 + i * (stepW + gap);
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: sx, y: 2.0, w: stepW, h: 4.5,
                fill: { color: C.card }, line: { color: C.border, pt: 1.2 }, rectRadius: 0.14
              });
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: sx + 0.22, y: 2.25, w: 1.35, h: 0.38,
                fill: { color: C.cyanDark }, line: { color: C.cyan, pt: 0.75 }, rectRadius: 0.08
              });
              pptSlide.addText(String(st.step || `KROK ${i + 1}`), {
                x: sx + 0.22, y: 2.27, w: 1.35, h: 0.34,
                fontFace: FONT, fontSize: 11, bold: true, color: C.cyan, align: 'center', valign: 'middle'
              });
              pptSlide.addText(String(st.title || ''), {
                x: sx + 0.22, y: 2.85, w: stepW - 0.44, h: 0.7,
                fontFace: FONT, fontSize: 17, bold: true, color: C.white, valign: 'top'
              });
              pptSlide.addText(String(st.text || ''), {
                x: sx + 0.22, y: 3.6, w: stepW - 0.44, h: 2.55,
                fontFace: FONT, fontSize: 13.5, color: C.text, valign: 'top'
              });
            });
          }

          // 8. ZÁVĚREČNÉ SHRNUTÍ (3 BOXY)
          else if (s.type === 'summary') {
            addHeader(pptSlide, s.badge, s.title);

            const boxes = s.boxes || [];
            const count = Math.max(boxes.length, 1);
            const gap = 0.28;
            const totalW = 12.03;
            const boxW = (totalW - gap * (count - 1)) / count;

            boxes.forEach((box, i) => {
              const bx = 0.65 + i * (boxW + gap);
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: bx, y: 1.95, w: boxW, h: 4.75,
                fill: { color: C.card }, line: { color: C.border, pt: 1.2 }, rectRadius: 0.14
              });
              pptSlide.addText(String(box.title || ''), {
                x: bx + 0.25, y: 2.2, w: boxW - 0.5, h: 0.55,
                fontFace: FONT, fontSize: 18, bold: true, color: C.cyan
              });
              pptSlide.addShape(pptx.ShapeType.line, {
                x: bx + 0.25, y: 2.8, w: boxW - 0.5, h: 0,
                line: { color: C.border, pt: 1 }
              });
              const itemRuns = (box.items || []).map((it) => ({
                text: String(it),
                options: { bullet: { code: '2713', color: C.cyan }, breakLine: true, paraSpaceAfter: 10 }
              }));
              if (itemRuns.length > 0) {
                pptSlide.addText(itemRuns, {
                  x: bx + 0.25, y: 3.0, w: boxW - 0.5, h: 3.45,
                  fontFace: FONT, fontSize: 14, color: C.text, valign: 'top'
                });
              }
            });
          }

          // 9. KAHOOT! SLAJD
          else if (s.type === 'kahoot') {
            const kUrl = s.kahootUrl || deck.kahootUrl || '';
            pptSlide.addText('INTERAKTIVNÍ OVĚŘENÍ ZNALOSTÍ', {
              x: 1.0, y: 1.6, w: 11.33, h: 0.4,
              fontFace: FONT, fontSize: 13, bold: true, color: C.cyan, align: 'center', charSpacing: 1.5
            });
            pptSlide.addText(String(s.title || 'KAHOOT!'), {
              x: 1.0, y: 2.15, w: 11.33, h: 1.1,
              fontFace: FONT, fontSize: 48, bold: true, color: C.white, align: 'center'
            });
            pptSlide.addText(String(s.subtitle || 'Čas na ověření znalostí'), {
              x: 1.8, y: 3.35, w: 9.73, h: 0.7,
              fontFace: FONT, fontSize: 20, color: C.text, align: 'center'
            });
            if (kUrl) {
              pptSlide.addShape(pptx.ShapeType.roundRect, {
                x: 4.4, y: 4.35, w: 4.53, h: 0.85,
                fill: { color: C.cyan }, line: { color: C.cyan }, rectRadius: 0.16
              });
              pptSlide.addText('Spustit Kahoot!', {
                x: 4.4, y: 4.38, w: 4.53, h: 0.8,
                fontFace: FONT, fontSize: 20, bold: true, color: '020617',
                align: 'center', valign: 'middle',
                hyperlink: { url: kUrl }
              });
              pptSlide.addText(kUrl, {
                x: 2.0, y: 5.35, w: 9.33, h: 0.4,
                fontFace: FONT, fontSize: 12, color: C.muted, align: 'center',
                hyperlink: { url: kUrl }
              });
            }
          }

          addFooter(pptSlide, idx, slides.length);
        }

        const safeFileName = (deck.title || 'prezentace')
          .replace(/[\\/:*?"<>|]/g, '-')
          .replace(/\s+/g, ' ')
          .trim();

        await pptx.writeFile({ fileName: `${safeFileName}.pptx` });
      }

      // Miniatura slajdu v poměru 16:9 (zmenšený živý náhled jako v PowerPointu)
      function SlideThumbnail({ slide, deckKahootUrl }) {
        const wrapperRef = useRef(null);
        const [scale, setScale] = useState(0.22);

        useEffect(() => {
          const el = wrapperRef.current;
          if (!el) return;
          const updateScale = () => {
            if (el.clientWidth > 0) {
              setScale(el.clientWidth / 1280);
            }
          };
          updateScale();
          if (typeof ResizeObserver !== 'undefined') {
            const observer = new ResizeObserver(updateScale);
            observer.observe(el);
            return () => observer.disconnect();
          }
          window.addEventListener('resize', updateScale);
          return () => window.removeEventListener('resize', updateScale);
        }, []);

        return React.createElement(
          'div',
          {
            ref: wrapperRef,

                            { className: 'text-xl font-extrabold text-white group-hover:text-[#00d2ff] transition' },
                            deck.title
                          )
                        )
                      ),
                      React.createElement('p', { className: 'text-slate-300 text-sm leading-relaxed mb-5' }, deck.subtitle),
                      React.createElement(
                        'div',
                        { className: 'flex flex-wrap gap-1.5 mb-6' },
                        deck.slides.slice(1, 6).map((s, idx) =>
                          React.createElement(
                            'span',
                            {
                              key: idx,
                              onClick: () => startPresentation(deck.id, idx + 1),
                              className:
                                'text-xs px-2.5 py-1 rounded-md bg-slate-950/90 text-slate-300 border border-slate-800 hover:border-[#00d2ff]/40 cursor-pointer transition truncate max-w-[200px]'
                            },
                            idx + 2,
                            '. ',
                            s.title
                          )
                        ),
                        deck.slides.length > 6 &&
                          React.createElement(
                            'span',
                            { className: 'text-xs px-2.5 py-1 rounded-md bg-slate-950/50 text-slate-500' },
                            '+',
                            deck.slides.length - 6,
                            ' dalších'
                          )
                      )
                    ),
                    React.createElement(
                      'div',
                      { className: 'pt-4 border-t border-slate-800/80 flex items-center gap-2.5' },
                      React.createElement(
                        'button',
                        {
                          onClick: () => startPresentation(deck.id, 0),
                          className:
                            'flex-1 py-2.5 px-4 rounded-xl bg-[#00d2ff] hover:bg-[#38bdf8] text-slate-950 font-extrabold text-sm flex items-center justify-center gap-2 transition shadow-[0_0_20px_rgba(0,210,255,0.2)]'
                        },
                        React.createElement(Play, { size: 16, fill: 'currentColor' }),
                        React.createElement('span', null, 'Spustit')
                      ),
                      React.createElement(
                        'button',
                        {
                          onClick: () => handleExportPdf(deck),
                          title: 'Stáhnout prezentaci jako PDF',
                          className:
                            'py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-[#00d2ff] font-semibold text-sm flex items-center gap-1.5 border border-slate-700 transition shrink-0'
                        },
                        React.createElement(Download, { size: 15 }),
                        React.createElement('span', null, 'PDF')
                      ),
                      React.createElement(
                        'button',
                        {
                          disabled: Boolean(exportingPptxId),
                          onClick: () => handleExportPptx(deck),
                          title: 'Stáhnout prezentaci pro PowerPoint (.pptx)',
                          className:
                            'py-2.5 px-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-amber-300 hover:text-amber-200 font-semibold text-sm flex items-center gap-1.5 border border-amber-400/30 transition shrink-0'
                        },
                        React.createElement(FileText, { size: 15 }),
                        React.createElement('span', null, isExportingThis ? 'Generuji...' : 'PPTX')
                      )
                    )
                  );
                })
              )
            )
          )
        );
      }

      const root = createRoot(document.getElementById('root'));
      root.render(React.createElement(PresentationOnlyApp, null));
    })();
  </script>
</body>
</html>
