                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {(slide.options || []).map((opt, idx) => {
                      const isSelected = selectedAnswer === idx;
                      const isCorrect = Number(slide.correctIndex) === idx;
                      const showResult = selectedAnswer !== null;

                      let btnStyle = 'bg-slate-800/80 border-slate-700 hover:border-[#00d2ff] text-slate-200';
                      if (showResult) {
                        if (isCorrect) {
                          btnStyle = 'bg-emerald-500/20 border-emerald-400 text-emerald-200 font-bold';
                        } else if (isSelected && !isCorrect) {
                          btnStyle = 'bg-rose-500/20 border-rose-400 text-rose-200';
                        } else {
                          btnStyle = 'bg-slate-900/40 border-slate-800 text-slate-500';
                        }
                      }

                      return (
                        <button
                          key={idx}
                          onClick={(e) => {
                            e.stopPropagation();
                            setSelectedAnswer(idx);
                          }}
                          className={`p-4 rounded-xl border text-left transition-all flex items-center justify-between gap-3 ${btnStyle}`}
                        >
                          <span className="text-sm sm:text-base">{opt}</span>
                          {showResult && isCorrect && <CheckCircle size={20} className="text-emerald-400 shrink-0" />}
                          {showResult && isSelected && !isCorrect && <XCircle size={20} className="text-rose-400 shrink-0" />}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ============================================================================
    // 4. HLAVNÍ APLIKACE
    // ============================================================================
    function App() {
      const [presentations, setPresentations] = useState(() => {
        try {
          const saved = localStorage.getItem('ict_portal_presentations_v1');
          return saved ? JSON.parse(saved) : INITIAL_PRESENTATIONS;
        } catch (e) {
          return INITIAL_PRESENTATIONS;
        }
      });

      const [resources, setResources] = useState(() => {
        try {
          const saved = localStorage.getItem('ict_portal_resources_v1');
          return saved ? JSON.parse(saved) : INITIAL_RESOURCES;
        } catch (e) {
          return INITIAL_RESOURCES;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('ict_portal_presentations_v1', JSON.stringify(presentations));
        } catch (e) {}
      }, [presentations]);

      useEffect(() => {
        try {
          localStorage.setItem('ict_portal_resources_v1', JSON.stringify(resources));
        } catch (e) {}
      }, [resources]);

      const [view, setView] = useState('dashboard');
      const [activeDeckId, setActiveDeckId] = useState(INITIAL_PRESENTATIONS[0].id);
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Vše');

      const [laserActive, setLaserActive] = useState(false);
      const [laserPos, setLaserPos] = useState({ x: 0, y: 0 });
      const [showSlideDrawer, setShowSlideDrawer] = useState(false);
      const playerContainerRef = useRef(null);

      const [iconPickerTarget, setIconPickerTarget] = useState(null);
      const [notification, setNotification] = useState(null);

      const [aiTopic, setAiTopic] = useState('Počítačové sítě: IP adresa, Router, Switch a Wi-Fi');
      const [jsonInput, setJsonInput] = useState('');

      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3500);
      };

      const activeDeck = presentations.find((p) => p.id === activeDeckId) || presentations[0];
      const activeSlide = activeDeck?.slides[currentSlideIndex] || activeDeck?.slides[0];

      useEffect(() => {
        if (view !== 'present') return;
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
            e.preventDefault();
            setCurrentSlideIndex((prev) => Math.min(prev + 1, (activeDeck?.slides.length || 1) - 1));
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            setCurrentSlideIndex((prev) => Math.max(prev - 1, 0));
          } else if (e.key === 'Escape') {
            if (document.fullscreenElement) {
              document.exitFullscreen().catch(() => {});
            } else {
              setView('dashboard');
            }
          } else if (e.key === 'f' || e.key === 'F') {
            toggleFullscreen();
          } else if (e.key === 'l' || e.key === 'L') {
            setLaserActive((prev) => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [view, activeDeck]);

      const toggleFullscreen = () => {
        if (!playerContainerRef.current) return;
        if (!document.fullscreenElement) {
          playerContainerRef.current.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      };

      const startPresentation = (deckId, slideIdx = 0) => {
        setActiveDeckId(deckId);
        setCurrentSlideIndex(slideIdx);
        setView('present');
      };

      const openEditor = (deckId) => {
        setActiveDeckId(deckId);
        setCurrentSlideIndex(0);
        setView('editor');
      };

      const updateActiveDeck = (updater) => {
        setPresentations((prev) =>
          prev.map((deck) => (deck.id === activeDeck.id ? updater(deck) : deck))
        );
      };

      const updateActiveSlide = (newSlideData) => {
        updateActiveDeck((deck) => {
          const updatedSlides = [...deck.slides];
          updatedSlides[currentSlideIndex] = {
            ...updatedSlides[currentSlideIndex],
            ...newSlideData
          };
          return { ...deck, updatedAt: new Date().toISOString().slice(0, 10), slides: updatedSlides };
        });
      };

      const addSlideWithTemplate = (templateType) => {
        const newId = 'slide-' + Date.now();
        const templates = {

              { icon: 'Shield', highlight: 'Parametr 3', title: 'Třetí bod', text: 'Stručné a jasné vysvětlení třetího pojmu pro studenty.' }

              { icon: 'Zap', title: 'Druhá důležitá část', text: 'Navazující vysvětlení principu fungování.' }
            ]
          },
          'big-stat': {
            id: newId,

          'steps-4': {

            type: 'steps-4',
            badge: 'KROK ZA KROKEM',
            title: 'Jak probíhá celý proces?',
            steps: [
              { step: 'KROK 1', icon: 'Mouse', title: 'Začátek', text: 'Co se stane jako úplně první.' },
              { step: 'KROK 2', icon: 'Cpu', title: 'Zpracování', text: 'Jak na to zareaguje procesor nebo systém.' },
              { step: 'KROK 3', icon: 'HardDrive', title: 'Přenos dat', text: 'Kudy data putují dál.' },
              { step: 'KROK 4', icon: 'Monitor', title: 'Výsledek', text: 'Co uvidí uživatel na obrazovce.' }
            ]
          },
          'summary': {
            id: newId,
            type: 'summary',
            badge: 'ZÁVĚREČNÉ SHRNUTÍ',
            title: 'Co si odnést z dnešní hodiny?',
            boxes: [
              { icon: 'Cpu', title: 'První oblast', items: ['Klíčový poznatek 1', 'Klíčový poznatek 2'] },
              { icon: 'Layers', title: 'Druhá oblast', items: ['Klíčový poznatek 1', 'Klíčový poznatek 2'] },
              { icon: 'CheckCircle', title: 'Třetí oblast', items: ['Klíčový poznatek 1', 'Klíčový poznatek 2'] }
            ]
          },
          'kahoot': {
            id: newId,
            type: 'kahoot',
            title: 'KAHOOT! Čas na ověření znalostí',
            subtitle: 'Připravte si telefony nebo odpovězte společně na tabuli.',
            question: 'Kontrolní otázka z dnešní látky?',
            options: ['Správná odpověď', 'Chybná možnost B', 'Chybná možnost C', 'Chybná možnost D'],
            correctIndex: 0
          }
        };

        const newSlide = templates[templateType] || templates['cards-3'];
        updateActiveDeck((deck) => {
          const nextSlides = [...deck.slides];
          nextSlides.splice(currentSlideIndex + 1, 0, newSlide);
          return { ...deck, slides: nextSlides };
        });
        setCurrentSlideIndex((prev) => prev + 1);
        showToast('Nový slajd byl přidán');
      };

      const deleteCurrentSlide = () => {
        if (activeDeck.slides.length <= 1) {
          showToast('Prezentace musí obsahovat alespoň 1 slajd');
          return;
        }
        updateActiveDeck((deck) => {
          const nextSlides = deck.slides.filter((_, idx) => idx !== currentSlideIndex);
          return { ...deck, slides: nextSlides };
        });
        setCurrentSlideIndex((prev) => Math.max(0, prev - 1));
        showToast('Slajd byl odstraněn');
      };

      const moveSlide = (direction) => {
        const targetIdx = currentSlideIndex + direction;
        if (targetIdx < 0 || targetIdx >= activeDeck.slides.length) return;
        updateActiveDeck((deck) => {
          const nextSlides = [...deck.slides];
          const [moved] = nextSlides.splice(currentSlideIndex, 1);
          nextSlides.splice(targetIdx, 0, moved);
          return { ...deck, slides: nextSlides };
        });
        setCurrentSlideIndex(targetIdx);
      };

      const createNewPresentation = () => {
        const newId = 'deck-' + Date.now();
        const newDeck = {
          id: newId,
          title: 'Nová výuková prezentace',
          subtitle: 'Popis tématu pro studenty střední školy.',
          category: 'Hardware',
          badge: 'ICT • Nové',
          icon: 'Sparkles',
          updatedAt: new Date().toISOString().slice(0, 10),
          kahootUrl: 'https://create.kahoot.it/',
          slides: [
            {
              id: 's-1',
              type: 'title',
              badge: 'ICT',
              icon: 'Sparkles',
              title: 'Nová výuková prezentace',
              subtitle: 'Klikněte vpravo a upravte nadpis, přidejte karty, obrázky nebo přirovnání.'
            },
            {
              id: 's-2',
              type: 'cards-3',
              badge: 'ÚVOD DO TÉMATU',
              title: 'Hlavní body dnešní hodiny',
              analogy: 'Přirovnání: Zde napište jednoduchou analogii ze života, kterou studenti ihned pochopí.',
              cards: [
                { icon: 'Cpu', highlight: 'Bod 1', title: 'První pojem', text: 'Vysvětlení prvního pojmu.' },
                { icon: 'Zap', highlight: 'Bod 2', title: 'Druhý pojem', text: 'Vysvětlení druhého pojmu.' },
                { icon: 'Shield', highlight: 'Bod 3', title: 'Třetí pojem', text: 'Vysvětlení třetího pojmu.' }
              ]
            }
          ]
        };
        setPresentations((prev) => [newDeck, ...prev]);
        setActiveDeckId(newId);
        setCurrentSlideIndex(0);
        setView('editor');
        showToast('Vytvořena nová prezentace');
      };

      const duplicatePresentation = (deck) => {
        const copy = {
          ...JSON.parse(JSON.stringify(deck)),
          id: 'deck-' + Date.now(),
          title: `${deck.title} (Kopie)`,
          updatedAt: new Date().toISOString().slice(0, 10)
        };
        setPresentations((prev) => [copy, ...prev]);
        showToast('Prezentace byla zduplikována');
      };

      const deletePresentation = (deckId) => {
        if (presentations.length <= 1) {
          showToast('Nelze smazat poslední prezentaci');
          return;
        }
        setPresentations((prev) => prev.filter((p) => p.id !== deckId));
        if (activeDeckId === deckId) {
          setActiveDeckId(presentations[0].id);
        }
        showToast('Prezentace byla smazána');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          updateActiveSlide({ imageUrl: event.target.result });
          showToast('Obrázek byl vložen do slajdu');
        };
        reader.readAsDataURL(file);
      };

      const exportAllData = () => {
        const dataStr = JSON.stringify({ presentations, resources }, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ict-prezentace-data-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Data byla vyexportována do souboru .json');
      };

      const importAllData = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.presentations && Array.isArray(parsed.presentations)) {
              setPresentations(parsed.presentations);
              if (parsed.resources) setResources(parsed.resources);
              showToast('Všechny prezentace byly úspěšně nahrány!');
            } else if (parsed.slides && Array.isArray(parsed.slides)) {
              setPresentations((prev) => [parsed, ...prev]);
              showToast(`Prezentace "${parsed.title}" byla přidána!`);
            }
          } catch (err) {
            showToast('Chyba: Soubor nemá platný JSON formát');
          }
        };
        reader.readAsText(file);
      };

      const resetToDefaults = () => {
        setPresentations(INITIAL_PRESENTATIONS);
        setResources(INITIAL_RESOURCES);
        localStorage.removeItem('ict_portal_presentations_v1');
        localStorage.removeItem('ict_portal_resources_v1');
        showToast('Obnoveny původní 4 prezentace');
      };

      const categories = ['Vše', 'Hardware', 'Operační systémy', 'Sítě', 'Programování'];
      const filteredPresentations = presentations.filter((p) => {
        const matchesCategory = selectedCategory === 'Vše' || p.category === selectedCategory;
        const matchesSearch =
          p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.subtitle.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (view === 'present' && activeDeck) {
        const totalSlides = activeDeck.slides.length;
        const progressPercent = ((currentSlideIndex + 1) / totalSlides) * 100;

        return (
          <div
            ref={playerContainerRef}
            onMouseMove={(e) => {
              if (laserActive) {
                setLaserPos({ x: e.clientX, y: e.clientY });
              }
            }}
            className={`fixed inset-0 bg-[#060a12] text-white flex flex-col justify-between z-50 select-none ${
              laserActive ? 'cursor-none' : ''
            }`}
          >
            {laserActive && (
              <div
                style={{ left: laserPos.x, top: laserPos.y }}
                className="pointer-events-none fixed z-50 -translate-x-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-rose-500 shadow-[0_0_20px_8px_rgba(244,63,94,0.85)] border-2 border-white"
              />
            )}

            <div className="flex items-center justify-between px-6 py-3 bg-slate-950/90 border-b border-slate-800/80 backdrop-blur-md z-20">
              <div className="flex items-center gap-3">
                <button
                  onClick={() => {
                    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
                    setView('dashboard');
                  }}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition"
                >
                  <ChevronLeft size={18} />
                  <span>Zpět na portál</span>
                </button>
                <span className="text-slate-600">|</span>
                <span className="font-bold text-white text-sm sm:text-base truncate max-w-md">
                  {activeDeck.title}
                </span>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setLaserActive(!laserActive)}
                  title="Laserové ukazovátko (Klávesa L)"

                    laserActive
                      ? 'bg-rose-500/20 text-rose-300 border-rose-500/50'
                      : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-700'
                  }`}
                >
                  <Pointer size={16} />
                  <span className="hidden sm:inline">Ukazovátko (L)</span>
                </button>

                <button
                  onClick={() => setShowSlideDrawer(!showSlideDrawer)}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-xs sm:text-sm font-medium transition"
                >
                  <List size={16} />
                  <span className="hidden sm:inline">Osnova ({currentSlideIndex + 1}/{totalSlides})</span>
                </button>

                <button
                  onClick={() => {
                    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
                    setView('editor');
                  }}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#00d2ff]/15 hover:bg-[#00d2ff]/25 text-[#00d2ff] border border-[#00d2ff]/30 text-xs sm:text-sm font-semibold transition"
                >
                  <Edit3 size={16} />
                  <span className="hidden sm:inline">Upravit slajd</span>
                </button>

                <button
                  onClick={toggleFullscreen}
                  title="Celá obrazovka (Klávesa F)"
                  className="p-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 transition"
                >
                  <Maximize2 size={16} />
                </button>
              </div>
            </div>

            <div
              onClick={() => {
                if (currentSlideIndex < totalSlides - 1) {
                  setCurrentSlideIndex(currentSlideIndex + 1);
                }
              }}
              className="relative flex-1 flex items-center justify-center p-2 sm:p-6 overflow-hidden"
            >
              <div className="w-full h-full max-w-[1600px] max-h-[900px] rounded-2xl overflow-hidden shadow-[0_0_70px_rgba(0,0,0,0.8)] border border-slate-800/80">

                <button
                  disabled={currentSlideIndex === 0}
                  onClick={() => setCurrentSlideIndex((prev) => Math.max(0, prev - 1))}
                  className="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-40 text-white font-semibold text-sm flex items-center gap-2 border border-slate-800 transition"
                >
                  <ChevronLeft size={18} />
                  <span>Předchozí</span>
                </button>
                <button

                      rows={2}
                      value={activeSlide.subtitle || ''}
                      onChange={(e) => updateActiveSlide({ subtitle: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                )}

                {(activeSlide.type === 'title' || activeSlide.type === 'section') && (
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1">Hlavní ikona slajdu</label>
                    <button
                      onClick={() =>
                        setIconPickerTarget(() => (selectedIcon) => updateActiveSlide({ icon: selectedIcon }))
                      }
                      className="flex items-center gap-3 px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:border-[#00d2ff] text-sm text-white"
                    >
                      <UnifiedIcon name={activeSlide.icon || 'Cpu'} size={20} className="p-1.5" />
                      <span>Změnit ikonu ({activeSlide.icon || 'Cpu'})</span>
                    </button>
                  </div>
                )}

                {(activeSlide.type === 'cards-3' || activeSlide.type === 'comparison') && (
                  <div>
                    <label className="block text-xs font-bold text-[#00d2ff] mb-1">
                      Přirovnání / ELI5 Analogie (Horní box)
                    </label>
                    <textarea
                      rows={2}
                      value={activeSlide.analogy || ''}
                      onChange={(e) => updateActiveSlide({ analogy: e.target.value })}
                      placeholder="Např. Frekvence je jako cyklista na rotopedu..."
                      className="w-full bg-slate-900 border border-[#00d2ff]/40 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                )}

                {activeSlide.type === 'cards-3' && (
                  <div className="space-y-4 pt-2 border-t border-slate-800">
                    <div className="text-xs font-bold uppercase text-[#00d2ff]">Jednotlivé karty (3 sloupce):</div>
                    {(activeSlide.cards || []).map((card, idx) => (
                      <div key={idx} className="p-3.5 rounded-xl bg-slate-900/90 border border-slate-800 space-y-2.5">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-slate-400">Karta #{idx + 1}</span>
                          <button
                            onClick={() =>
                              setIconPickerTarget(() => (selectedIcon) => {
                                const nextCards = [...activeSlide.cards];
                                nextCards[idx] = { ...nextCards[idx], icon: selectedIcon };
                                updateActiveSlide({ cards: nextCards });
                              })
                            }
                            className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-[#00d2ff]/20 text-xs text-[#00d2ff] border border-slate-700"
                          >
                            <UnifiedIcon name={card.icon} size={14} className="p-1 border-0 bg-transparent shadow-none" />
                            <span>Ikona: {card.icon}</span>
                          </button>
                        </div>

                        <input
                          type="text"
                          value={card.highlight || ''}
                          onChange={(e) => {
                            const nextCards = [...activeSlide.cards];
                            nextCards[idx] = { ...nextCards[idx], highlight: e.target.value };
                            updateActiveSlide({ cards: nextCards });
                          }}
                          placeholder="Zvýrazněný parametr"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-[#00d2ff] font-bold"
                        />

                        <input
                          type="text"
                          value={card.title || ''}
                          onChange={(e) => {
                            const nextCards = [...activeSlide.cards];
                            nextCards[idx] = { ...nextCards[idx], title: e.target.value };
                            updateActiveSlide({ cards: nextCards });
                          }}
                          placeholder="Nadpis karty"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white font-bold"
                        />

                        <textarea
                          rows={2}
                          value={card.text || ''}
                          onChange={(e) => {
                            const nextCards = [...activeSlide.cards];
                            nextCards[idx] = { ...nextCards[idx], text: e.target.value };
                            updateActiveSlide({ cards: nextCards });
                          }}
                          placeholder="Popis karty"
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-300"
                        />
                      </div>
                    ))}
                  </div>
                )}

                {activeSlide.type === 'split-image' && (
                  <div className="space-y-4 pt-2 border-t border-slate-800">
                    <div className="text-xs font-bold uppercase text-[#00d2ff]">Obrázek na slajdu:</div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1.5">
                        1. Nahrát vlastní obrázek z počítače:
                      </label>
                      <label className="w-full py-2.5 px-4 rounded-xl bg-[#00d2ff]/15 hover:bg-[#00d2ff]/25 text-[#00d2ff] border border-[#00d2ff]/40 text-xs font-bold flex items-center justify-center gap-2 cursor-pointer transition">
                        <Upload size={16} />
                        <span>Vybrat soubor obrázku (PNG, JPG, SVG)</span>
                        <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                      </label>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1">2. Nebo vložit URL odkaz obrázku:</label>
                      <input
                        type="text"
                        value={activeSlide.imageUrl?.startsWith('data:') ? '' : activeSlide.imageUrl || ''}
                        onChange={(e) => updateActiveSlide({ imageUrl: e.target.value })}
                        placeholder="https://..."
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1">3. Nebo vybrat hotové IT schéma:</label>
                      <div className="grid grid-cols-1 gap-1.5">
                        {PRESET_IMAGES.map((img) => (
                          <button
                            key={img.id}
                            onClick={() => updateActiveSlide({ imageUrl: img.url, imageCaption: img.name })}
                            className="text-left px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 flex items-center gap-2"
                          >
                            <ImageIcon size={14} className="text-[#00d2ff]" />
                            <span>{img.name}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Popisek pod obrázkem:</label>
                      <input
                        type="text"
                        value={activeSlide.imageCaption || ''}
                        onChange={(e) => updateActiveSlide({ imageCaption: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white"
                      />
                    </div>

                    <div className="text-xs font-bold uppercase text-[#00d2ff] pt-2">Textové body vlevo:</div>
                    {(activeSlide.points || []).map((pt, idx) => (
                      <div key={idx} className="p-3 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs text-slate-400">Bod #{idx + 1}</span>
                          <button
                            onClick={() =>
                              setIconPickerTarget(() => (selectedIcon) => {
                                const nextPts = [...activeSlide.points];
                                nextPts[idx] = { ...nextPts[idx], icon: selectedIcon };
                                updateActiveSlide({ points: nextPts });
                              })
                            }
                            className="text-xs text-[#00d2ff] hover:underline"
                          >
                            Změnit ikonu ({pt.icon})
                          </button>
                        </div>
                        <input
                          type="text"
                          value={pt.title || ''}
                          onChange={(e) => {
                            const nextPts = [...activeSlide.points];
                            nextPts[idx] = { ...nextPts[idx], title: e.target.value };
                            updateActiveSlide({ points: nextPts });
                          }}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white font-bold"
                        />
                        <textarea
                          rows={2}
                          value={pt.text || ''}
                          onChange={(e) => {
                            const nextPts = [...activeSlide.points];
                            nextPts[idx] = { ...nextPts[idx], text: e.target.value };
                            updateActiveSlide({ points: nextPts });
                          }}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-300"
                        />
                      </div>
                    ))}
                  </div>
                )}

                {activeSlide.type === 'big-stat' && (
                  <div className="space-y-3 pt-2 border-t border-slate-800">
                    <div>
                      <label className="block text-xs font-bold text-[#00d2ff] mb-1">Obří číslo / údaj</label>
                      <input
                        type="text"
                        value={activeSlide.stat || ''}
                        onChange={(e) => updateActiveSlide({ stat: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-base font-extrabold text-[#00d2ff]"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">Podtitul čísla</label>
                      <input
                        type="text"
                        value={activeSlide.statLabel || ''}
                        onChange={(e) => updateActiveSlide({ statLabel: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">Vysvětlující komentář</label>
                      <textarea
                        rows={3}
                        value={activeSlide.description || ''}
                        onChange={(e) => updateActiveSlide({ description: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300"
                      />
                    </div>
                  </div>
                )}

                {activeSlide.type === 'kahoot' && (
                  <div className="space-y-3 pt-2 border-t border-slate-800">
                    <div>
                      <label className="block text-xs font-bold text-[#00d2ff] mb-1">Kontrolní otázka na slajdu</label>
                      <textarea
                        rows={2}
                        value={activeSlide.question || ''}
                        onChange={(e) => updateActiveSlide({ question: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>
                    <div className="text-xs font-bold text-slate-400">Možnosti odpovědí (zaškrtněte správnou):</div>
                    {(activeSlide.options || []).map((opt, idx) => (
                      <div key={idx} className="flex items-center gap-2">
                        <input
                          type="radio"
                          name="correctOpt"
                          checked={Number(activeSlide.correctIndex) === idx}
                          onChange={() => updateActiveSlide({ correctIndex: idx })}
                        />
                        <input
                          type="text"
                          value={opt}
                          onChange={(e) => {
                            const nextOpts = [...activeSlide.options];
                            nextOpts[idx] = e.target.value;
                            updateActiveSlide({ options: nextOpts });
                          }}
                          className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                        />
                      </div>
                    ))}
                  </div>
                )}
              </aside>
            </div>
          )}

          {view === 'ai-generator' && (
            <main className="max-w-5xl w-full mx-auto px-4 sm:px-8 py-8 flex-1 space-y-8">
              <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
                <div className="flex items-center gap-3 text-[#00d2ff] font-bold text-sm uppercase tracking-wider mb-2">
                  <Sparkles size={18} />
                  <span>Zjednodušení tvorby nových prezentací</span>
                </div>
                <h1 className="text-2xl sm:text-4xl font-extrabold text-white mb-3">
                  AI Generátor se 100% jednotným designem a ikonami
                </h1>
                <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                  Zkopírujte připravený prompt do ChatGPT, Claude nebo Gemini, vložte vygenerovaný kód sem a prezentace se okamžitě vytvoří ve vašem stylu!
                </p>

                <div className="mt-6 space-y-4">
                  <label className="block text-sm font-bold text-white">
                    1. Zadejte téma vaší příští hodiny (automaticky se vloží do promptu):
                  </label>
                  <input
                    type="text"
                    value={aiTopic}
                    onChange={(e) => setAiTopic(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-semibold focus:outline-none focus:border-[#00d2ff]"
                  />

                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-bold uppercase text-[#00d2ff]">
                        Připravený prompt pro AI (ChatGPT / Gemini / Claude):
                      </span>
                      <button
                        onClick={() => {
                          const promptText = `Jsi středoškolský učitel informatiky (ICT). Vytvoř kompletní výukovou prezentaci na téma "${aiTopic}" přesně v tomto JSON formátu. Používej chytlavá přirovnání z běžného života (ELI5 analogie) a vybírej ikony výhradně ze seznamu: Cpu, HardDrive, Monitor, Zap, Fan, Shield, Terminal, Layers, Box, Cloud, Wifi, Globe, Lock, Key, User, Users, Clock, Flame, Wrench, Sliders, Activity, Database, Disc, Compass, Sparkles, AlertTriangle, CheckCircle, Gamepad2, Smartphone, Server, Rocket, Car.

Vrať POUZE čistý JSON objekt v této struktuře:
{
  "id": "deck-${Date.now()}",
  "title": "${aiTopic}",
  "subtitle": "Stručný podnadpis hodiny",
  "category": "Sítě",
  "badge": "ICT",
  "icon": "Wifi",
  "updatedAt": "2025-03-01",
  "slides": [
    { "id": "s1", "type": "title", "badge": "ICT", "icon": "Wifi", "title": "${aiTopic}", "subtitle": "Úvodní popis tématu" },
    { "id": "s2", "type": "cards-3", "badge": "ZÁKLADNÍ PRINCIP", "title": "Hlavní myšlenka", "analogy": "Přirovnání: ...", "cards": [
      { "icon": "Globe", "highlight": "Pojem 1", "title": "Nadpis 1", "text": "Vysvětlení..." },
      { "icon": "Wifi", "highlight": "Pojem 2", "title": "Nadpis 2", "text": "Vysvětlení..." },
      { "icon": "Shield", "highlight": "Pojem 3", "title": "Nadpis 3", "text": "Vysvětlení..." }
    ]},
    { "id": "s3", "type": "comparison", "badge": "POROVNÁNÍ", "title": "Varianta A vs. Varianta B", "analogy": "Rozdíl v praxi...", "left": { "icon": "Box", "title": "Varianta A", "subtitle": "Popis", "points": ["Bod 1", "Bod 2"] }, "right": { "icon": "Zap", "title": "Varianta B", "subtitle": "Popis", "points": ["Bod 1", "Bod 2"] } },
    { "id": "s4", "type": "kahoot", "title": "KAHOOT!", "subtitle": "Čas na ověření znalostí", "question": "Kontrolní otázka?", "options": ["Správně", "Špatně 1", "Špatně 2", "Špatně 3"], "correctIndex": 0 }
  ]
}`;
                          navigator.clipboard.writeText(promptText);
                          showToast('Prompt byl zkopírován do schránky!');
                        }}
                        className="px-3 py-1.5 rounded-lg bg-[#00d2ff] text-slate-950 font-bold text-xs flex items-center gap-1.5"
                      >
                        <Copy size={14} />
                        <span>Zkopírovat prompt pro AI</span>
                      </button>
                    </div>
                    <p className="text-xs text-slate-400 font-mono leading-relaxed">
                      Jsi středoškolský učitel informatiky (ICT). Vytvoř kompletní výukovou prezentaci na téma &quot;{aiTopic}&quot; s ELI5 přirovnáními a sjednocenými ikonami v JSON formátu...
                    </p>
                  </div>
                </div>

                <div className="mt-6 space-y-3">
                  <label className="block text-sm font-bold text-white">
                    2. Vložte sem vygenerovaný JSON z AI a klikněte na Vytvořit prezentaci:
                  </label>
                  <textarea
                    rows={7}
                    value={jsonInput}
                    onChange={(e) => setJsonInput(e.target.value)}
                    placeholder='Sem vložte JSON objekt začínající { "id": ..., "title": ... }'
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-xs font-mono text-[#00d2ff] focus:outline-none focus:border-[#00d2ff]"
                  />
                  <button
                    onClick={() => {
                      try {
                        const cleaned = jsonInput.replace(/```json/g, '').replace(/```/g, '').trim();
                        const parsed = JSON.parse(cleaned);
                        if (parsed.title && Array.isArray(parsed.slides)) {
                          const newDeck = { ...parsed, id: 'deck-' + Date.now() };
                          setPresentations((prev) => [newDeck, ...prev]);
                          setActiveDeckId(newDeck.id);
                          setCurrentSlideIndex(0);
                          setJsonInput('');
                          setView('editor');
                          showToast('Nová prezentace byla vygenerována a otevřena v editoru!');
                        } else {
                          showToast('JSON neobsahuje pole "slides"');
                        }
                      } catch (e) {
                        showToast('Neplatný JSON formát – zkontrolujte zkopírovaný text');
                      }
                    }}
                    className="px-6 py-3 rounded-xl bg-[#00d2ff] hover:bg-[#38bdf8] text-slate-950 font-extrabold text-sm flex items-center gap-2 shadow-lg transition"
                  >
                    <Sparkles size={18} />
                    <span>Vytvořit prezentaci ze vloženého JSONu</span>
                  </button>
                </div>
              </div>
            </main>
          )}

          {view === 'github-guide' && (
            <main className="max-w-5xl w-full mx-auto px-4 sm:px-8 py-8 flex-1 space-y-8">
              <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
                <h2 className="text-2xl font-extrabold text-white mb-2 flex items-center gap-3">
                  <Save size={24} className="text-[#00d2ff]" />
                  <span>Zálohování a přenos prezentací</span>
                </h2>
                <p className="text-slate-300 text-sm sm:text-base mb-6">
                  Všechny vaše úpravy se okamžitě ukládají do paměti prohlížeče (`localStorage`). Zde si můžete kdykoliv stáhnout kompletní záložní soubor `.json` nebo ho nahrát na školním počítači.
                </p>

                <div className="flex flex-wrap gap-4">
                  <button
                    onClick={exportAllData}
                    className="px-5 py-3 rounded-xl bg-[#00d2ff] hover:bg-[#38bdf8] text-slate-950 font-extrabold text-sm flex items-center gap-2 shadow-lg transition"
                  >
                    <Download size={18} />
                    <span>Stáhnout kompletní data (.json)</span>
                  </button>

                  <label className="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm flex items-center gap-2 border border-slate-700 cursor-pointer transition">
                    <Upload size={18} className="text-[#00d2ff]" />
                    <span>Nahrát data ze souboru (.json)</span>
                    <input type="file" accept=".json" onChange={importAllData} className="hidden" />
                  </label>

                  <button
                    onClick={resetToDefaults}
                    className="px-5 py-3 rounded-xl bg-slate-900 hover:bg-rose-950/50 text-slate-400 hover:text-rose-300 font-semibold text-sm flex items-center gap-2 border border-slate-800 transition ml-auto"
                  >
                    <RefreshCw size={16} />
                    <span>Obnovit výchozí 4 prezentace</span>
                  </button>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
