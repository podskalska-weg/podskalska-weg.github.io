<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT Výukový Portál | SŠ</title>
  
  <!-- Tailwind CSS pro styly -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel pro přímé spuštění TSX/JSX v prohlížeči -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Import mapa pro React a ikony Lucide -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.3.1"
      }
    }
  </script>
</head>
<body class="bg-[#0b1120] text-slate-100 antialiased selection:bg-[#00d2ff] selection:text-slate-950">
  <div id="root"></div>

  <!-- Načtení a spuštění vašeho souboru main.tsx -->
  <script type="text/babel" data-presets="react,typescript" data-type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import App from './main.tsx';

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
